name: MSVC build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build with MSVC
        run: .\build-msvc.bat
        shell: cmd
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: fan-minitool-msvc-x64
          path: |
            build/fan-minitool.exe
            build/fan-minitool.ini
          if-no-files-found: error
